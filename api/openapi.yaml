openapi: 3.1.0
info:
  title: ChatP2P Backend API
  version: 0.1.0
  description: Backend-only private chat service. Frontend teams should treat this file as the REST API contract.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: System
    description: Service health and operational endpoints
  - name: Docs
    description: Live API contract and project documentation endpoints
  - name: Auth
    description: Registration, login, and token issuing
  - name: Users
    description: Authenticated user profile APIs
  - name: Stickers
    description: Built-in sticker pack catalog and assets
  - name: Friends
    description: Friend request and contact APIs
  - name: Conversations
    description: Conversation APIs
  - name: Sync
    description: Offline and reconnect synchronization APIs
  - name: Realtime
    description: WebSocket event stream
paths:
  /healthz:
    get:
      tags:
        - System
      summary: Check service health
      operationId: getHealth
      responses:
        "200":
          description: Service is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/docs/openapi.yaml:
    get:
      tags:
        - Docs
      summary: Get latest OpenAPI document
      operationId: getOpenAPIDocument
      description: Returns the current `api/openapi.yaml` file from the running server's repository checkout.
      responses:
        "200":
          description: Latest OpenAPI YAML document.
          content:
            application/yaml:
              schema:
                type: string
            text/yaml:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/docs/recent:
    get:
      tags:
        - Docs
      summary: Get recently updated documentation
      operationId: listRecentDocs
      description: Returns recently modified Markdown files from `docs/`, including full content for quick frontend display.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
          description: Maximum number of recent docs to return.
      responses:
        "200":
          description: Recently updated documentation files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentDocsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/ws:
    get:
      tags:
        - Realtime
      summary: Open WebSocket event stream
      operationId: openRealtimeWebSocket
      description: "Browser clients may pass `accessToken` as a query parameter. Non-browser clients should prefer `Authorization: Bearer <token>`."
      parameters:
        - name: accessToken
          in: query
          required: false
          schema:
            type: string
          description: Bearer token for clients that cannot set custom WebSocket headers.
      responses:
        "101":
          description: WebSocket upgrade accepted. Events use `RealtimeEvent` envelopes.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/sync:
    get:
      tags:
        - Sync
      summary: Sync state after reconnect
      operationId: syncState
      description: Returns the current conversation list and a page of messages created or updated after the supplied sync cursor. Prefer `cursor` for stable resume and pagination.
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          required: false
          deprecated: true
          schema:
            type: string
            format: date-time
          description: Legacy sync timestamp. Prefer `cursor` for stable resume. Do not combine with `cursor`.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque sync cursor returned by the previous response's `nextCursor`. Do not combine with `since`.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of conversations and changed messages returned on this page.
      responses:
        "200":
          description: Synchronization snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Register a user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User was created and authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Login with username and password
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credentials were accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/sticker-packs:
    get:
      tags:
        - Stickers
      summary: List sticker packs
      operationId: listStickerPacks
      description: Returns built-in sticker packs and their stickers. Sticker message bodies should use the sticker `id`. Built-in assets are packaged from OpenMoji SVGs.
      responses:
        "200":
          description: Sticker packs available to clients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StickerPackListResponse"
  /api/v1/sticker-packs/{packId}/stickers:
    get:
      tags:
        - Stickers
      summary: List stickers in a pack
      operationId: listStickers
      parameters:
        - name: packId
          in: path
          required: true
          schema:
            type: string
          example: classic-faces
      responses:
        "200":
          description: Stickers in the requested pack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StickerListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/stickers/{stickerId}/asset.svg:
    get:
      tags:
        - Stickers
      summary: Get sticker SVG asset
      operationId: getStickerAsset
      parameters:
        - name: stickerId
          in: path
          required: true
          schema:
            type: string
          example: classic-smile
      responses:
        "200":
          description: Sticker SVG image.
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/users:
    get:
      tags:
        - Users
      summary: Search users
      operationId: searchUsers
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 32
          description: Matches username or display name.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Matched users, excluding the current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users/me:
    get:
      tags:
        - Users
      summary: Get current user profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current authenticated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags:
        - Users
      summary: Update current user profile
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          description: Updated authenticated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/friend-requests:
    post:
      tags:
        - Friends
      summary: Send a friend request
      operationId: sendFriendRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendFriendRequestRequest"
      responses:
        "201":
          description: Friend request was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags:
        - Friends
      summary: List friend requests
      operationId: listFriendRequests
      security:
        - bearerAuth: []
      parameters:
        - name: box
          in: query
          required: false
          schema:
            type: string
            enum:
              - incoming
              - outgoing
              - all
            default: incoming
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - accepted
              - declined
            default: pending
      responses:
        "200":
          description: Friend requests for the selected box and status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequestListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/friend-requests/{id}/accept:
    post:
      tags:
        - Friends
      summary: Accept a friend request
      operationId: acceptFriendRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FriendRequestId"
      responses:
        "200":
          description: Friend request was accepted and a direct conversation is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequestActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/friend-requests/{id}/decline:
    post:
      tags:
        - Friends
      summary: Decline a friend request
      operationId: declineFriendRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FriendRequestId"
      responses:
        "200":
          description: Friend request was declined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/friends:
    get:
      tags:
        - Friends
      summary: List current user's friends
      operationId: listFriends
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user's friends.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/friends/{userId}:
    delete:
      tags:
        - Friends
      summary: Remove a friend
      operationId: removeFriend
      description: Removes the accepted friendship between the current user and the target user. Existing conversations and messages are not deleted.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Friendship was removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/blocks:
    get:
      tags:
        - Friends
      summary: List blocked users
      operationId: listBlockedUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Users blocked by the current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedUserListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/blocks/{userId}:
    post:
      tags:
        - Friends
      summary: Block a user
      operationId: blockUser
      description: Blocks the target user, removes any friendship and friend-request state between the two users, and prevents new friend requests or direct conversation entry. Existing conversations and messages are not deleted.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "201":
          description: User was blocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags:
        - Friends
      summary: Unblock a user
      operationId: unblockUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: User was unblocked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/conversations:
    get:
      tags:
        - Conversations
      summary: List current user's conversations
      operationId: listConversations
      security:
        - bearerAuth: []
      parameters:
        - name: before
          in: query
          required: false
          deprecated: true
          schema:
            type: string
            format: date-time
          description: Legacy timestamp filter for conversation lists. Prefer `cursor` for stable pagination.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque pagination cursor returned by the previous list response. Do not combine with `before`.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include conversations archived by the current user. Archived conversations are hidden by default.
      responses:
        "200":
          description: Conversations ordered by pinned state, pin time, then latest activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/conversations/direct:
    post:
      tags:
        - Conversations
      summary: Get or create a direct conversation with a friend
      operationId: createDirectConversation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectConversationRequest"
      responses:
        "200":
          description: Existing or newly created direct conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/conversations/group:
    post:
      tags:
        - Conversations
      summary: Create a group conversation
      operationId: createGroupConversation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupConversationRequest"
      responses:
        "201":
          description: Group conversation was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/conversations/{conversationId}:
    patch:
      tags:
        - Conversations
      summary: Rename a group conversation
      operationId: renameGroupConversation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameGroupConversationRequest"
      responses:
        "200":
          description: Group conversation was renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/conversations/{conversationId}/settings:
    patch:
      tags:
        - Conversations
      summary: Update current user's conversation settings
      operationId: updateConversationSettings
      description: Updates per-user settings for an existing conversation membership. Send an empty `mutedUntil` string to clear mute.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationSettingsUpdateRequest"
      responses:
        "200":
          description: Updated conversation settings for the current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/conversations/{conversationId}/owner:
    patch:
      tags:
        - Conversations
      summary: Transfer group ownership
      operationId: transferGroupConversationOwner
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferGroupConversationOwnerRequest"
      responses:
        "200":
          description: Group owner was transferred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/conversations/{conversationId}/members:
    post:
      tags:
        - Conversations
      summary: Add members to a group conversation
      operationId: addGroupConversationMembers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGroupConversationMembersRequest"
      responses:
        "200":
          description: Members were added to the group conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/conversations/{conversationId}/members/{userId}:
    delete:
      tags:
        - Conversations
      summary: Remove a member from a group conversation
      operationId: removeGroupConversationMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Member was removed from the group conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/conversations/{conversationId}/leave:
    post:
      tags:
        - Conversations
      summary: Leave a group conversation
      operationId: leaveGroupConversation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Current user left the group conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/conversations/{conversationId}/messages:
    post:
      tags:
        - Conversations
      summary: Send a message in a conversation
      operationId: sendMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Message was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags:
        - Conversations
      summary: List conversation messages
      operationId: listMessages
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: before
          in: query
          required: false
          deprecated: true
          schema:
            type: string
            format: date-time
          description: Legacy timestamp filter for older messages. Prefer `cursor` for stable pagination.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque pagination cursor returned by the previous list response. Do not combine with `before`.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Messages ordered from oldest to newest within the returned page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/message-favorites:
    get:
      tags:
        - Conversations
      summary: List favorited messages
      operationId: listMessageFavorites
      description: Returns messages favorited by the current user. Messages deleted for the current user are not returned.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Favorited messages ordered by newest favorite first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageFavoriteListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/conversations/{conversationId}/messages/forward:
    post:
      tags:
        - Conversations
      summary: Forward multiple messages
      operationId: forwardMessages
      description: Copies visible, non-recalled source messages into a target conversation. The request order is preserved in the created messages.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardMessagesRequest"
      responses:
        "201":
          description: Messages were forwarded into the target conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageBatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/conversations/{conversationId}/messages/favorite:
    post:
      tags:
        - Conversations
      summary: Favorite multiple messages
      operationId: favoriteMessages
      description: Favorites visible, non-recalled messages for the current user. Supports multi-select UI.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageIdsRequest"
      responses:
        "200":
          description: Messages were favorited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageFavoriteListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/conversations/{conversationId}/messages/delete:
    post:
      tags:
        - Conversations
      summary: Delete multiple messages for current user
      operationId: deleteMessagesForMe
      description: Hides messages only for the current user. This does not recall the message and does not remove it for other conversation members.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageIdsRequest"
      responses:
        "200":
          description: Messages were hidden for the current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMessagesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/conversations/{conversationId}/messages/{messageId}:
    patch:
      tags:
        - Conversations
      summary: Edit a message
      operationId: editMessage
      description: The original sender can edit their own non-recalled text message. Edited messages keep the same `id` and include edit metadata.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditMessageRequest"
      responses:
        "200":
          description: Message was edited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags:
        - Conversations
      summary: Delete a message for current user
      operationId: deleteMessageForMe
      description: Hides this message only for the current user. Use recall if the sender needs the message to disappear for everyone.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "204":
          description: Message was hidden for the current user.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/conversations/{conversationId}/messages/{messageId}/forward:
    post:
      tags:
        - Conversations
      summary: Forward a single message
      operationId: forwardMessage
      description: Copies a visible, non-recalled source message into a target conversation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardMessageRequest"
      responses:
        "201":
          description: Message was forwarded into the target conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/conversations/{conversationId}/messages/{messageId}/favorite:
    post:
      tags:
        - Conversations
      summary: Favorite a single message
      operationId: favoriteMessage
      description: Favorites a visible, non-recalled message for the current user.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: Message was favorited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageFavorite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags:
        - Conversations
      summary: Remove a message favorite
      operationId: unfavoriteMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "204":
          description: Message favorite was removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/conversations/{conversationId}/messages/{messageId}/recall:
    post:
      tags:
        - Conversations
      summary: Recall a message
      operationId: recallMessage
      description: The original sender can recall their own message. Recalled messages keep the same `id`, return an empty `body`, and include recall metadata.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: Message was recalled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/conversations/{conversationId}/read:
    post:
      tags:
        - Conversations
      summary: Mark a conversation read through a message
      operationId: markConversationRead
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadRequest"
      responses:
        "200":
          description: Messages through the target message were marked read for the current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadThroughResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    FriendRequestId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: The request body or fields are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication failed or the bearer token is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated user cannot perform this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: A conflicting resource already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: The server could not complete the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - version
        - startedAt
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: chatp2p
        version:
          type: string
          example: 0.1.0
        startedAt:
          type: string
          format: date-time
          example: "2026-05-04T01:00:00Z"
    RecentDocsResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecentDoc"
    RecentDoc:
      type: object
      required:
        - path
        - title
        - updatedAt
        - content
      properties:
        path:
          type: string
          description: Repository-relative Markdown document path.
          example: docs/frontend.md
        title:
          type: string
          description: First Markdown H1 in the document, or the filename if no H1 is present.
          example: Frontend Integration
        updatedAt:
          type: string
          format: date-time
          description: Last modified timestamp from the server filesystem.
        content:
          type: string
          description: Full Markdown document content.
    RealtimeEvent:
      type: object
      required:
        - type
        - data
        - sentAt
      properties:
        type:
          type: string
          enum:
            - message.created
            - message.edited
            - message.recalled
            - message.read
            - conversation.updated
            - presence.updated
            - typing.started
            - typing.stopped
        data:
          oneOf:
            - $ref: "#/components/schemas/Message"
            - $ref: "#/components/schemas/MessageReadEvent"
            - $ref: "#/components/schemas/ConversationUpdatedEvent"
            - $ref: "#/components/schemas/PresenceEvent"
            - $ref: "#/components/schemas/TypingEvent"
        sentAt:
          type: string
          format: date-time
    RealtimeClientEvent:
      type: object
      required:
        - type
        - data
      properties:
        type:
          type: string
          enum:
            - typing.started
            - typing.stopped
        data:
          $ref: "#/components/schemas/TypingClientPayload"
    TypingClientPayload:
      type: object
      required:
        - conversationId
      properties:
        conversationId:
          type: string
          format: uuid
    SyncResponse:
      type: object
      required:
        - serverTime
        - conversations
        - messages
        - nextCursor
        - hasMore
      properties:
        serverTime:
          type: string
          format: date-time
          description: Server-side snapshot time for the response. Legacy clients may reuse this as the next `since` value.
        conversations:
          type: array
          description: Current conversation summaries, including archived conversations and per-user settings.
          items:
            $ref: "#/components/schemas/ConversationSummary"
        messages:
          type: array
          description: Current page of messages created or updated after the supplied sync cursor, ordered oldest to newest by change order.
          items:
            $ref: "#/components/schemas/Message"
        nextCursor:
          type: string
          description: Cursor to store after processing the page. When `hasMore` is true, call sync again immediately with this cursor.
        hasMore:
          type: boolean
          description: True when more changed messages remain in the current sync window.
    RegisterRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          example: alice
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: password123
        displayName:
          type: string
          maxLength: 32
          example: Alice
        avatarUrl:
          type: string
          maxLength: 2048
          description: Optional avatar image URL. Absolute http(s) URLs and app-relative paths are accepted.
          example: https://cdn.example.com/avatars/alice.png
        bio:
          type: string
          maxLength: 160
          example: Ready to chat.
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: alice
        password:
          type: string
          format: password
          example: password123
    AuthSession:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: Bearer token for authenticated API calls.
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          format: int64
          description: Token lifetime in seconds.
          example: 86400
        user:
          $ref: "#/components/schemas/UserProfile"
    StickerPackListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StickerPack"
    StickerListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Sticker"
    StickerPack:
      type: object
      required:
        - id
        - name
        - description
        - builtIn
      properties:
        id:
          type: string
          example: classic-faces
        name:
          type: string
          example: Little Yellow Faces
        description:
          type: string
        builtIn:
          type: boolean
        stickers:
          type: array
          items:
            $ref: "#/components/schemas/Sticker"
    Sticker:
      type: object
      required:
        - id
        - packId
        - name
        - description
        - keywords
        - assetUrl
        - mimeType
      properties:
        id:
          type: string
          example: classic-smile
        packId:
          type: string
          example: classic-faces
        name:
          type: string
          example: Smile
        description:
          type: string
        keywords:
          type: array
          items:
            type: string
        assetUrl:
          type: string
          description: App-relative URL for the sticker image asset.
          example: /api/v1/stickers/classic-smile/asset.svg
        mimeType:
          type: string
          example: image/svg+xml
    UserSearchResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserProfile"
    ProfileUpdateRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 32
          example: Alice Updated
        avatarUrl:
          type: string
          maxLength: 2048
          description: Send an empty string to clear the avatar.
          example: /avatars/alice.png
        bio:
          type: string
          maxLength: 160
          description: Send an empty string to clear the bio.
          example: Usually online at night.
    SendFriendRequestRequest:
      type: object
      required:
        - targetUserId
      properties:
        targetUserId:
          type: string
          format: uuid
        message:
          type: string
          maxLength: 120
          example: Hi, let's chat.
    FriendRequest:
      type: object
      required:
        - id
        - requester
        - addressee
        - message
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        requester:
          $ref: "#/components/schemas/UserProfile"
        addressee:
          $ref: "#/components/schemas/UserProfile"
        message:
          type: string
        status:
          type: string
          enum:
            - pending
            - accepted
            - declined
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FriendRequestListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FriendRequest"
    FriendRequestActionResponse:
      type: object
      required:
        - request
        - conversation
      properties:
        request:
          $ref: "#/components/schemas/FriendRequest"
        conversation:
          $ref: "#/components/schemas/Conversation"
    FriendListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Friend"
    Friend:
      type: object
      required:
        - user
        - friendSince
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        friendSince:
          type: string
          format: date-time
    BlockedUserListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BlockedUser"
    BlockedUser:
      type: object
      required:
        - user
        - blockedAt
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        blockedAt:
          type: string
          format: date-time
    DirectConversationRequest:
      type: object
      required:
        - targetUserId
      properties:
        targetUserId:
          type: string
          format: uuid
    CreateGroupConversationRequest:
      type: object
      required:
        - title
        - memberIds
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 64
          example: Weekend Plans
        memberIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          description: Friend user IDs to add to the group. The creator is added automatically.
          items:
            type: string
            format: uuid
    TransferGroupConversationOwnerRequest:
      type: object
      required:
        - targetUserId
      properties:
        targetUserId:
          type: string
          format: uuid
          description: Current group member who will become the new owner.
    RenameGroupConversationRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 64
          example: Weekend Plans Updated
    AddGroupConversationMembersRequest:
      type: object
      required:
        - memberIds
      properties:
        memberIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          description: Friend user IDs to add to the group. Existing members are rejected.
          items:
            type: string
            format: uuid
    ConversationSettingsUpdateRequest:
      type: object
      description: At least one property must be provided. `mutedUntil` must be a future RFC3339 timestamp, or an empty string to clear mute.
      properties:
        pinned:
          type: boolean
          description: Set to true to pin the conversation, or false to clear the pin.
        mutedUntil:
          type: string
          description: Future RFC3339 timestamp for mute expiry. Send an empty string to clear mute.
          example: "2030-01-01T12:00:00Z"
        archived:
          type: boolean
          description: Set to true to hide the conversation from the default list, or false to restore it.
    ConversationSettings:
      type: object
      required:
        - conversationId
      properties:
        conversationId:
          type: string
          format: uuid
        pinnedAt:
          type: string
          format: date-time
          description: Present when the current user has pinned the conversation.
        mutedUntil:
          type: string
          format: date-time
          description: Present when the current user has muted the conversation.
        archivedAt:
          type: string
          format: date-time
          description: Present when the current user has archived the conversation.
    ConversationListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
        nextCursor:
          type: string
          description: Opaque cursor for fetching the next page. Omitted when there are no more results.
    ConversationSummary:
      type: object
      required:
        - id
        - type
        - title
        - createdBy
        - members
        - lastMessage
        - unreadCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - direct
            - group
        title:
          type: string
        createdBy:
          type: string
          format: uuid
          description: User ID that currently owns the conversation.
        members:
          type: array
          items:
            $ref: "#/components/schemas/UserProfile"
        lastMessage:
          description: Latest message in this conversation, or null when no message has been sent yet.
          anyOf:
            - $ref: "#/components/schemas/Message"
            - type: "null"
        unreadCount:
          type: integer
          minimum: 0
          description: Count of messages from other members that the current user has not marked read.
        pinnedAt:
          type: string
          format: date-time
          description: Present when the current user has pinned the conversation.
        mutedUntil:
          type: string
          format: date-time
          description: Present when the current user has muted the conversation.
        archivedAt:
          type: string
          format: date-time
          description: Present when the current user has archived the conversation.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Conversation:
      type: object
      required:
        - id
        - type
        - title
        - createdBy
        - members
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - direct
            - group
        title:
          type: string
        createdBy:
          type: string
          format: uuid
          description: User ID that currently owns the conversation.
        members:
          type: array
          items:
            $ref: "#/components/schemas/UserProfile"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SendMessageRequest:
      type: object
      required:
        - body
      properties:
        type:
          type: string
          enum:
            - text
            - sticker
          default: text
          description: Use `text` for normal chat text and `sticker` when `body` is a sticker id from the sticker catalog.
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: Text content for `text` messages. Sticker id for `sticker` messages.
          example: hello
        quoteMessageId:
          type: string
          format: uuid
          description: Optional message id from the same conversation to quote. The quoted message must be visible to the sender and not recalled.
    EditMessageRequest:
      type: object
      required:
        - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
          example: updated message text
    ForwardMessageRequest:
      type: object
      required:
        - targetConversationId
      properties:
        targetConversationId:
          type: string
          format: uuid
    ForwardMessagesRequest:
      type: object
      required:
        - messageIds
        - targetConversationId
      properties:
        messageIds:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
        targetConversationId:
          type: string
          format: uuid
    MessageIdsRequest:
      type: object
      required:
        - messageIds
      properties:
        messageIds:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
    MessageBatchResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
    DeleteMessagesResponse:
      type: object
      required:
        - deletedMessageIds
      properties:
        deletedMessageIds:
          type: array
          items:
            type: string
            format: uuid
    MessageFavorite:
      type: object
      required:
        - message
        - favoritedAt
      properties:
        message:
          $ref: "#/components/schemas/Message"
        favoritedAt:
          type: string
          format: date-time
    MessageFavoriteListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MessageFavorite"
    MessageListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        nextCursor:
          type: string
          description: Opaque cursor for fetching older messages. Omitted when there are no more results.
    Message:
      type: object
      required:
        - id
        - conversationId
        - sender
        - type
        - body
        - readBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        sender:
          $ref: "#/components/schemas/UserProfile"
        type:
          type: string
          enum:
            - text
            - sticker
        body:
          type: string
          description: Message text for `text`, sticker id for `sticker`. This is an empty string after the message has been recalled.
        quotedMessage:
          description: Message preview quoted by this message. Omitted when the message is not a quote.
          allOf:
            - $ref: "#/components/schemas/QuotedMessage"
        readBy:
          type: array
          description: Users who have marked this message as read.
          items:
            $ref: "#/components/schemas/ReadReceipt"
        editedAt:
          type: string
          format: date-time
          description: Present when the message has been edited.
        editedBy:
          description: User who last edited the message. Present when `editedAt` is present.
          allOf:
            - $ref: "#/components/schemas/UserProfile"
        recalledAt:
          type: string
          format: date-time
          description: Present when the message has been recalled.
        recalledBy:
          description: User who recalled the message. Present when `recalledAt` is present.
          allOf:
            - $ref: "#/components/schemas/UserProfile"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    QuotedMessage:
      type: object
      required:
        - id
        - conversationId
        - sender
        - type
        - body
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        sender:
          $ref: "#/components/schemas/UserProfile"
        type:
          type: string
          enum:
            - text
            - sticker
        body:
          type: string
          description: Quoted message text or sticker id. Empty when the quoted message has been recalled.
        recalledAt:
          type: string
          format: date-time
          description: Present when the quoted message has been recalled.
        createdAt:
          type: string
          format: date-time
    ReadReceipt:
      type: object
      required:
        - user
        - readAt
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        readAt:
          type: string
          format: date-time
    MarkReadRequest:
      type: object
      required:
        - messageId
      properties:
        messageId:
          type: string
          format: uuid
    ReadThroughResponse:
      type: object
      required:
        - conversationId
        - readThroughMessageId
        - readAt
      properties:
        conversationId:
          type: string
          format: uuid
        readThroughMessageId:
          type: string
          format: uuid
        readAt:
          type: string
          format: date-time
    MessageReadEvent:
      type: object
      required:
        - conversationId
        - readThroughMessageId
        - reader
        - readAt
      properties:
        conversationId:
          type: string
          format: uuid
        readThroughMessageId:
          type: string
          format: uuid
        reader:
          $ref: "#/components/schemas/UserProfile"
        readAt:
          type: string
          format: date-time
    ConversationUpdatedEvent:
      type: object
      required:
        - conversationId
        - conversation
        - actor
        - action
        - occurredAt
      properties:
        conversationId:
          type: string
          format: uuid
        conversation:
          $ref: "#/components/schemas/Conversation"
        actor:
          $ref: "#/components/schemas/UserProfile"
        action:
          type: string
          enum:
            - renamed
            - owner_transferred
            - members_added
            - member_removed
            - member_left
        member:
          description: Affected member for owner transfer, remove, and leave actions.
          anyOf:
            - $ref: "#/components/schemas/UserProfile"
            - type: "null"
        members:
          type: array
          description: Added members for the `members_added` action.
          items:
            $ref: "#/components/schemas/UserProfile"
        occurredAt:
          type: string
          format: date-time
    PresenceEvent:
      type: object
      required:
        - user
        - status
        - online
        - changedAt
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        status:
          type: string
          enum:
            - online
            - offline
        online:
          type: boolean
        changedAt:
          type: string
          format: date-time
    TypingEvent:
      type: object
      required:
        - conversationId
        - user
        - state
        - occurredAt
      properties:
        conversationId:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/UserProfile"
        state:
          type: string
          enum:
            - started
            - stopped
        occurredAt:
          type: string
          format: date-time
    UserProfile:
      type: object
      required:
        - id
        - username
        - displayName
        - avatarUrl
        - bio
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: "2d5b8f2e-7c71-44bd-bb5f-3f4b7c945ef3"
        username:
          type: string
          example: alice
        displayName:
          type: string
          example: Alice
        avatarUrl:
          type: string
          example: https://cdn.example.com/avatars/alice.png
        bio:
          type: string
          example: Ready to chat.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: invalid_request
        message:
          type: string
          example: request validation failed
